[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "narraforge"
version = "0.1.0"
description = "Data-driven narrative engine runtime and tooling"
authors = [{name = "NarraForge Team"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
narraforge = "narraforge.cli:main"
